name: bycreep
options:
  bundleIdPrefix: com.bycreep
  deploymentTarget:
    iOS: "16.0"

targets:
  bycreep:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Доступ к галерее нужен для сохранения ежемесячных фото прогресса"
    dependencies:
      - target: bycreepWidget
        embed: true

  bycreepWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bycreep.app.widget
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: bycreepWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
